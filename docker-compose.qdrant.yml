# Docker Compose para correr Qdrant local desde el repo de Phobos.
#
# Uso (desde D:\IA\opencode\):
#   docker compose -f docker-compose.qdrant.yml up -d
#   docker compose -f docker-compose.qdrant.yml down
#   docker compose -f docker-compose.qdrant.yml logs -f
#
# NOTA IMPORTANTE — conflicto con la instancia global de Phobos:
#
#   El instalador del wizard (`npx github:sebaarce/phobos` → "Memory") copia
#   una versión idéntica a ~/.phobos/docker-compose.qdrant.yml y levanta un
#   contenedor con el mismo nombre (`phobos-qdrant`) y puerto (`6333`).
#
#   Si tenés esa instancia global corriendo Y querés levantar esta del repo,
#   bajá primero la global:
#     docker compose -f ~/.phobos/docker-compose.qdrant.yml down
#
#   Después podés trabajar con la del repo. Cuando termines de probar acá:
#     docker compose -f docker-compose.qdrant.yml down
#
# Storage:
#   ./qdrant-storage/  (relativo al CWD del shell — gitignored)
#
# Dashboard:
#   http://localhost:6333/dashboard
#
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: phobos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (no usado por el cliente JS pero útil para tooling)
    volumes:
      - ./qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ""              # local-only, sin auth
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat < /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
