services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: phobos-qdrant
    restart: unless-stopped
    # Bind a loopback (127.0.0.1) — Qdrant queda accesible SOLO desde la máquina
    # local. Sin esto, Docker Desktop mapea a 0.0.0.0 y el puerto queda visible
    # en LAN. Cualquier proceso en la misma red podría leer/escribir/borrar
    # vectores (Qdrant corre sin auth en este setup local).
    # Si necesitás acceso remoto, cambialo a "0.0.0.0:6333:6333" PERO configurá
    # QDRANT__SERVICE__API_KEY primero o exponé via reverse proxy con TLS.
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC (no usado por el cliente JS pero expuesto para tooling)
    volumes:
      - ./qdrant-storage:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: "INFO"
    # IMPORTANTE: NO setear QDRANT__SERVICE__API_KEY (ni siquiera vacío "").
    # En algunas versiones de Qdrant un string vacío se interpreta como
    # "habilitar auth con key vacía" y rechaza todos los requests sin header
    # api-key con 401 Unauthorized. Para deshabilitar auth, no setear la var.
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat < /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
