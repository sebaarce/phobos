services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: phobos-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC (not used by the JS client, but exposed for tooling)
    volumes:
      - ./.qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ""              # local-only, no auth
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'cat < /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
